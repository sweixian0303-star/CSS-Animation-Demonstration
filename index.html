<!DOCTYPE html> <!--HTML5 文档-->
<html lang="zh"> <!--翻译中文-->
    <head>
        <meta charset="UTF-8"> <!--文档编码-->
        <title>CSS动画展示</title> <!--标题-->
        <style>
            *{margin: 0; padding:0; box-sizing: border-box;} /*通配符， 外边框 0， 内边框 0， 格子设置：把边框和内边距都包在宽高里*/

            body{
                background:#14161f; /*背景*/
                color: #e8e8ec; /*颜色*/
                font-family: 'Segeo UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;/*字体种类：西文字体（适用于Windows), 中文字体-平方简体(适用于macOS/iOS)，微软雅黑(适用于windows), 无衬线字体(适用于所有系统)*/
                display: flex;/*显示方式：弹性布局*/
                justify-content: center;/*对齐方式： 居中*/
                padding: 60px 20px;/* 内边距: 60 x 40*/
                min-height: 100vh;/*最小值高度: 100*/
            }

            .page{
                max-width: 960px; /* 最大宽度：960*/
                width: 100%; /*宽度 100%*/
            }

            h1{
                font-size: 28px; /*字体大小： 28*/
                font-weight: 600;/*字体粗细： 600*/
                margin-bottom: 8px;/*外边距：8*/
            }

            .subtitle{
                color: #9296a8;/*颜色*/
                margin-bottom: 40px;/*外边距*/
                font-size: 15px;/*字体大小: 15*/
            }

            .container{
                display: grid; /*显示方式：网格布局容器*/
                grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));/*让浏览器自己算能排几列：循环复制（自动容纳/自动平分， 尺寸范围：最小180px 最大1fr）*/
                gap: 20px; /*子元素之间的间距：20*/
            }

            .card{
                background: #1e2130; /*背景*/
                border-radius: 12px; /*边框圆角程度*/
                padding: 36px 16px 24px; /* 宽度*/
                display: flex; /*显示方式： 弹性*/
                flex-direction: column; /*让子元素竖着排列*/
                align-items: center;/*让所有子元素在“交叉轴”上居中对齐*/
                gap: 20px;/*子元素之间的间距*/
                min-height: 160px;/*最低高度*/
                justify-content: center; /*对齐方式：居中*/
            }

            .card p{
                font-size: 13px; /*文字大小*/
                color: #9296a8; /*颜色*/
            }

            .box{
                width: 56px; /*宽度*/
                height: 56px; /*高度*/
                border-radius: 10px; /*边框圆角程度*/
            }

            @keyframes rotate{ /*让元素真正动起来*/
                from {
                    transform: rotate(0deg);/*元素状态：旋转（0度）*/
                }
                to{
                    transform: rotate(360deg);/*元素状态： 旋转（360度）*/
                }
            }

            .box-rotate{
                background: #6c8cff; /*背景*/
                animation: rotate 2s linear infinite;/*旋转 2秒 均速 无限循环*/
            }

            @keyframes pulse{
                0% {transform:  scale(1); opacity: 1;}/*起点 正常大小 完全不透明*/
                50% {transform: scale(1.3); opacity: 0.6;}/*中间 稍微放大 一点点变淡*/
                100%{transform: scale(1); opacity: 1;}/*终点 正常大小 不透明*/
            }

            .box-pulse{
                background: #ff8a5c; /*背景*/
                animation: pulse 1.5s ease-in-out infinite; /*脉搏 1.5秒 慢速开始中间加速慢速结束 无限循环*/
            }

            @keyframes bounce{
                0%, 100%{transform:  translateY(0);} /*起点-终点， 垂直方向不偏移*/
                50% {transform: translateY(-24px);} /*中间 向上平移24px*/
            }

            .box-bounce{
                background: #5ce1a0; /*背景*/
                border-radius: 50%; /*边框圆角50*/
                animation: bounce 1s ease-in-out infinite;/*bounce 1秒 慢速开始中间加速慢速结束 无限循环*/
            }

            @keyframes slideIn{
                from{transform: translateX(-40px); opacity: 0;}/*向左偏移40px， 完全透明*/
                to{transform: translateX(0); opacity: 1;}/*向左偏移0px, 不透明*/
            }

            .box-slide{
                background: #d9a5ff;/*背景*/
                animation:  slideIn 1s ease-out forwards;/*slideIn 1秒 快速开始慢速结束 永久停留在最后一刻*/
            }

            .spinner{
                width: 48px;/*宽度*/
                height: 48px; /*高度*/
                background: transparent; /*透明*/
                border: 5px solid #333648;/*边框： 边框粗细， 边框样式：实线， 边框颜色*/
                border-top: 5px solid #6c8cff;/*顶部： 5px 实线 颜色*/
                border-radius: 50%; /*边框圆角*/
                animation: rotate 1s linear infinite;/*rotate 1秒 均速 无限循环*/
            }

            @keyframes shake{
                0%, 100%{transform: translateX(0);}/*开始-结束 向左偏移（0）*/
                25% {transform: translateX(-8px);}/*25% 向左偏移8px*/
                75% { transform:  translateX(8px);}/*向右偏移8px*/
            }

            .box-shake{
                background: #ff6b81;/*背景*/
                animation: shake 0.6s ease-in-out infinite;/*shake 0.6秒 快速开始慢速结束 无限循环*/
            }

            .box-hover{
                background: #ffd166;/*背景*/
                transition: transform 0.3s ease, box-shadow 0.3 ease, border-radius 0.3 ease;/*让元素的位移/旋转、阴影发光、以及圆角变化，在 0.3 秒内同步、平滑地过渡*/
                cursor: pointer;/*当鼠标光标悬浮在该元素上时，变成一只‘伸出食指的小手*/
            }

            .box-hover:hover{
                transform:  translateY(-8px) scale(1.1); /*向上漂移8px 整体放大1.1倍*/
                box-shadow: 0 12px 24px rgba(255, 209, 102, 0.35); /*元素添加一个非常柔和、具有发光感（Glow）的暖黄色/金黄色阴影。*/
                border-radius: 50%; /*边框圆角*/
            }

            @keyframes colorShift{
                0% {background: #6c8cff;}
                33%{background: #5ce1a0;}
                66%{background: #ff8a5c;}
                100%{background: #6c8cff;}
            }

            .box-color{
                animation: colorShift 3s ease-in-out infinite;/*colorShift 3秒 慢速开始中间加速慢速结束*/
            }

            footer{
                margin-top: 40px; /*外边框顶部*/
                font-size: 13px; /*文字大小*/
                color: #5c6078; /*颜色*/
                text-align: center; /*对齐方式：两边对齐*/
            }
        </style>
    </head>
    <body>
        <div class="page"> <!--分类名-->
            <h1>CSS 动画展示</h1> <!--小标题-->
            <p class="subtitle">八种常用CSS动画写法， 鼠标 悬浮在“悬浮弹起”卡片上试试</p> <!--内容介绍-->

            <!--内容-->
            <div class="container"> 
                <div class="card">
                    <div class="box box-rotate"></div>
                    <p>旋转 rotate</p>
                </div>

                <div class="card">
                    <div class="box box-pulse"></div>
                    <p>脉冲 pulse</p>
                </div>

                <div class="card">
                    <div class="box box-bounce"></div>
                    <p>弹跳 bounce</p>
                </div>

                <div class="card">
                    <div class="box box-slide"></div>
                    <p>滑入 slideIn</p>
                </div>

                <div class="card">
                    <div class="spinner"></div>
                    <p>加载中 loading</p>
                </div>

                <div class="card">
                    <div class="box box-shake"></div>
                    <p>摇晃 shake</p>
                </div>

                <div class="card">
                    <div class="box box-hover"></div>
                    <p>悬浮弹起 hover</p>
                </div>

                <div class="card">
                    <div class="box box-color"></div>
                    <p>渐变色 colorShift</p>
                </div>
            </div>

            <!--底部-->
            <footer>
                用 @keyframe + animation + transition 写成 . 打开这个文件的源码逐段对照学习
            </footer>
        </div>
    </body>
</html>
